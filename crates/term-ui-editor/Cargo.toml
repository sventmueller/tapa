[package]
name = "term-ui-editor"
version.workspace = true
description = "The editor tab of a workspace: a TextKit 2 view over one document, with Vim keys and Markdown formatting"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
term-base.workspace = true
term-document.workspace = true
term-project.workspace = true
term-render.workspace = true
term-seal.workspace = true
term-ui.workspace = true
term-ui-dictation = { workspace = true, optional = true }
term-vim.workspace = true
splat-git.workspace = true
splat-i18n.workspace = true
splat-import.workspace = true
splat-markdown.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
term-workspace-hack.workspace = true

[dev-dependencies]
term-base = { workspace = true, features = ["testing"] }

[features]
# The microphone in the status bar, which dictates into the editor through lowspeak.
dictation = ["dep:term-ui-dictation", "term-ui-dictation/engine"]
# What the self-test reads of the editors and does with them.
selftest = []
