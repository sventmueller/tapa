[package]
name = "term-ui-preview"
version.workspace = true
description = "Documents as they read: the Markdown preview beside its editor with splat's render path, and tabs for pictures decoded in splat's sandboxed service, PDFs and Quick Look"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
term-base.workspace = true
term-document.workspace = true
term-render.workspace = true
term-ui.workspace = true
term-ui-editor.workspace = true
splat-decoder.workspace = true
splat-editor-state.workspace = true
splat-file-state.workspace = true
splat-i18n.workspace = true
splat-markdown.workspace = true
splat-preview.workspace = true
splat-render.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
libc = { workspace = true, optional = true }
term-workspace-hack.workspace = true

[dev-dependencies]
term-base = { workspace = true, features = ["testing"] }

[features]
# What the self-test reads of the previews and asks of the decoding service.
selftest = ["dep:libc", "splat-decoder/selftest", "splat-render/selftest", "term-ui-editor/selftest"]
