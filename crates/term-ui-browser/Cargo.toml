[package]
name = "term-ui-browser"
version.workspace = true
description = "The browser tab: a WKWebView with its navigation row, downloads, logins and dev server certificates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
term-base.workspace = true
term-config.workspace = true
term-render.workspace = true
term-ui.workspace = true
splat-i18n.workspace = true
block2.workspace = true
objc2 = { workspace = true, features = ["catch-all"] }
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-security = { workspace = true, features = ["std", "objc2", "SecBase", "SecTrust"] }
objc2-web-kit.workspace = true

[dev-dependencies]
term-base = { workspace = true, features = ["testing"] }

[features]
# What the self-test reads of a tab, the panels it answers, and a data store and downloads that leave nothing behind.
selftest = []
