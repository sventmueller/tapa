[package]
name = "term-opencode"
version.workspace = true
description = "OpenCode over its own v2 HTTP API: the server process, its event stream, the management calls and the mapping onto the thread model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "opencode-test-server"
path = "src/bin/opencode-test-server.rs"
test = false
required-features = ["testing"]

[features]
# The stand-in of `opencode serve` and its program, for tests and the self-test; not in the shipped app.
testing = []

[dependencies]
base64 = "0.23.1"
term-base.workspace = true
term-process.workspace = true
term-thread.workspace = true
serde.workspace = true
serde_json.workspace = true
term-workspace-hack.workspace = true

[dev-dependencies]
# Itself with the stand-in, for the integration tests.
term-opencode = { path = ".", features = ["testing"] }
term-base = { workspace = true, features = ["testing"] }
