[package]
name = "term-workspace-hack"
version.workspace = true
description = "One feature set per shared dependency, so building a single crate reuses the workspace's builds (E24)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# `cargo hakari generate` writes the section below and `make lint` fails when it is stale (E24).

### BEGIN HAKARI SECTION
[dependencies]
aho-corasick = { version = "1" }
base64 = { version = "0.23" }
bitflags = { version = "2", default-features = false, features = ["std"] }
block2 = { version = "0.6" }
crc32fast = { version = "1" }
crossbeam-utils = { version = "0.8", default-features = false, features = ["std"] }
derive_more = { version = "2", features = ["add", "display", "from", "into"] }
dispatch2 = { version = "0.3" }
fastrand = { version = "2" }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
indexmap = { version = "2", features = ["serde"] }
libc = { version = "0.2" }
memchr = { version = "2" }
miniz_oxide = { version = "0.9", features = ["simd"] }
num-traits = { version = "0.2", features = ["i128"] }
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-core-foundation = { version = "0.3" }
objc2-core-video = { version = "0.3", default-features = false, features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "objc2"] }
objc2-foundation = { version = "0.3" }
objc2-image-io = { version = "0.3", default-features = false, features = ["CGImageProperties", "CGImageSource", "objc2"] }
objc2-security = { version = "0.3", default-features = false, features = ["Authorization", "SecBase", "SecItem", "SecTrust", "objc2", "std"] }
objc2-user-notifications = { version = "0.3" }
once_cell = { version = "1" }
phf_shared = { version = "0.14" }
regex = { version = "1" }
regex-automata = { version = "0.4" }
regex-syntax = { version = "0.8" }
serde = { version = "1", features = ["derive", "rc"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
simd-adler32 = { version = "0.3" }
smallvec = { version = "1", default-features = false, features = ["const_new"] }
toml_datetime = { version = "1", features = ["serde"] }
toml_parser = { version = "1" }
toml_writer = { version = "1" }
ureq = { version = "3", features = ["platform-verifier"] }
winnow = { version = "1" }

